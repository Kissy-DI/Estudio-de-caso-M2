<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio de Caso · CANVAS-UTEM</title>
<style>
:root{--bg:#F4F8FC;--surface:#FFFFFF;--text:#12263F;--muted:#4A5D73;--navy:#0B3A6F;--on-navy:#FFFFFF;--mint:#1FBF8A;--mint-soft:#B5F3DD;--ok-bg:#D9F7EC;--ok-bd:#1FBF8A;--bad-bg:#FDE8EA;--bad-bd:#D64550;--line:#CBD8E6;--chip:#E3ECF6;--warn:#E8A317;--eyebrow:#0B7A57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B2E;--surface:#12293F;--text:#E8F0F8;--muted:#A9BBCF;--navy:#164E8A;--ok-bg:#0F3B33;--ok-bd:#3DDBA8;--bad-bg:#3B1F24;--bad-bd:#E5707A;--line:#27415C;--chip:#1D3A57;--eyebrow:#3DDBA8;--mint:#3DDBA8}}
:root[data-theme="dark"]{--bg:#0B1B2E;--surface:#12293F;--text:#E8F0F8;--muted:#A9BBCF;--navy:#164E8A;--ok-bg:#0F3B33;--ok-bd:#3DDBA8;--bad-bg:#3B1F24;--bad-bd:#E5707A;--line:#27415C;--chip:#1D3A57;--eyebrow:#3DDBA8;--mint:#3DDBA8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Aptos,Calibri,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:20px 20px 48px}
.bar{height:8px;background:var(--chip);border-radius:8px;overflow:hidden;margin-bottom:24px}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;color:var(--eyebrow);text-transform:uppercase;margin:0 0 8px}
h1{font-size:clamp(30px,6vw,46px);line-height:1.1;margin:0 0 12px;color:var(--text)}
h2{font-size:clamp(24px,4.5vw,34px);line-height:1.15;margin:0 0 12px}
p{margin:0 0 14px}
.hero{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:36px 28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--mint);opacity:.9}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{color:var(--mint-soft)}.hero h1{color:#fff}
.sub{font-size:22px;font-style:italic;color:var(--mint-soft)}
.btn{font:inherit;font-weight:700;background:var(--mint);color:#0B3A6F;border:0;border-radius:14px;padding:14px 26px;cursor:pointer;margin-top:10px;min-height:48px}
.btn:hover{filter:brightness(1.07)}.btn:focus-visible,.opt:focus-visible,.step:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.cards{display:grid;gap:16px;margin:20px 0}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.alert{background:var(--surface);border:2px solid var(--line);border-top:8px solid var(--warn);border-radius:18px;padding:22px}
.alert svg{width:72px;height:72px;margin-bottom:8px}.alert h3{margin:0 0 6px;font-size:21px}
.opts{display:grid;gap:12px;margin:18px 0}
.opt{font:inherit;color:var(--text);text-align:left;display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;width:100%;min-height:64px}
.opt:not(:disabled):hover{border-color:var(--navy);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.badge{flex:none;width:40px;height:40px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.ok{background:var(--ok-bg);border-color:var(--ok-bd)}.opt.ok .badge{background:var(--mint);color:#0B3A6F}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-bd)}.opt.bad .badge{background:var(--bad-bd);color:#fff}
.fb{border:2px solid var(--ok-bd);background:var(--ok-bg);border-radius:16px;padding:18px 20px;margin-top:6px}
.fb.bad{border-color:var(--bad-bd);background:var(--bad-bg)}.fb h3{margin:0 0 6px;font-size:20px}.fb p{margin:0}
.mock{border:2px solid var(--navy);border-radius:14px;overflow:hidden;background:var(--surface);margin:12px 0 4px;font-size:16px}
.mock b.t{display:block;background:var(--navy);color:#fff;padding:8px 14px}.mock div{padding:8px 14px;border-top:1px solid var(--line)}
.steps{display:grid;gap:12px;margin:18px 0}
.step{font:inherit;color:var(--text);text-align:left;display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;width:100%}
.step .n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.step.on{background:var(--ok-bg);border-color:var(--ok-bd)}.step.on .n{background:var(--mint);color:#0B3A6F}
.step strong{display:block;font-size:19px}.step span.d{color:var(--muted)}
.score{font-size:56px;font-weight:800;color:var(--eyebrow);margin:6px 0}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
var Q=[
{tag:"Pregunta 1 · Diagnóstico de visibilidad",t:"¿Por qué no se ve la Unidad 2?",p:"Los archivos individuales tienen el check verde activo, pero los estudiantes no los ven.",
o:["Falta de credenciales de Pasaporte UTEM.","El módulo contenedor (“Unidad 2”) o el curso están despublicados.","El formato PDF no es compatible.","Deben ingresar por Microsoft Teams."],a:1,
w:"El check verde de cada archivo no basta: si el módulo contenedor o el curso están despublicados, los estudiantes no ven nada."},
{tag:"Pregunta 2 · Monitoreo en SpeedGrader",t:"Trazabilidad de entregas con SpeedGrader",p:"¿Cómo verificar si los estudiantes entregaron la Tarea N° 1 a tiempo y si el profesor corrigió?",
m:'<div class="mock"><b class="t">SpeedGrader · Tarea N° 1</b><div><b>Enviado:</b> fecha y hora · <b>Intento:</b> 1</div><div><b>Nota:</b> sin calificar · <b>Comentarios:</b> 0</div></div>',
o:["Revisar en SpeedGrader la fecha/hora de envío, los intentos y la columna de comentarios/notas.","Borrar la tarea y crear un cuestionario nuevo.","Pedir reenvío por correo personal.","Revisar el Calendario general."],a:0,
w:"SpeedGrader concentra la fecha y hora de envío, los intentos, las notas y los comentarios de cada estudiante."},
{tag:"Pregunta 3 · Herramientas de corrección",t:"Anotaciones directas sobre entregables",p:"El docente requiere corregir rápidamente sobre el documento enviado en PDF. ¿Qué herramienta debe usar?",
o:["Mensajes en la Bandeja de Entrada.","Herramientas de anotación y dibujo integradas en SpeedGrader.","Anuncios semanales.","Registro de asistencia."],a:1,
w:"SpeedGrader permite comentar, resaltar y dibujar directamente sobre el PDF entregado."}];
var P=[["Activar el check verde del módulo de la Unidad 2","Publicar el módulo contenedor para que los estudiantes vean documentos y guía."],["Coordinar con el docente para calificar en SpeedGrader","Revisar las entregas pendientes y calificar con retroalimentación."],["Publicar un anuncio semanal","Informar a los estudiantes sobre la actualización realizada."]];
var lock='<svg viewBox="0 0 64 64" role="img" aria-label="Archivo bloqueado"><rect x="14" y="28" width="36" height="28" rx="6" fill="#0B3A6F"/><path d="M22 28v-8a10 10 0 0 1 20 0v8" fill="none" stroke="#0B3A6F" stroke-width="5"/><circle cx="32" cy="42" r="4" fill="#3DDBA8"/></svg>';
var hg='<svg viewBox="0 0 64 64" role="img" aria-label="Reloj de arena: entrega pendiente"><path d="M16 8h32M16 56h32" stroke="#0B3A6F" stroke-width="5"/><path d="M20 8c0 14 12 16 12 24S20 42 20 56h24c0-14-12-16-12-24s12-10 12-24z" fill="#0B3A6F"/><path d="M26 52c2-6 6-6 12 0z" fill="#3DDBA8"/></svg>';
var s={step:0,score:0,pick:null,done:[false,false,false]},app=document.getElementById("app"),L="ABCD";
function bar(){return '<div class="bar" aria-hidden="true"><i style="width:'+Math.round(s.step/6*100)+'%"></i></div>'}
function render(){var h="",i;
if(s.step===0){h='<section class="hero"><p class="eyebrow">Módulo 2 — Herramientas en CANVAS-UTEM para el Acompañamiento Docente</p><h1>Actividad Formativa: Estudio de Caso</h1><p class="sub">“La Unidad 2 invisible y las tareas sin revisar”</p><button class="btn" data-a="next">Comenzar</button></section>';}
else if(s.step===1){h=bar()+'<p class="eyebrow">El desafío · Planteamiento del caso</p><h2>Situación en el Aula Virtual</h2><p>Transcurridas 3 semanas de clases, los estudiantes reportan dos problemas principales:</p><div class="cards"><div class="alert">'+lock+'<h3>1. Contenido invisible</h3><p>No pueden visualizar los documentos ni la guía de la “Unidad 2: Metodología”.</p></div><div class="alert">'+hg+'<h3>2. Tarea sin revisar</h3><p>Enviaron la “Tarea N° 1” hace 10 días y sigue figurando como “sin calificar” y sin retroalimentación.</p></div></div><button class="btn" data-a="next">Resolver el caso</button>';}
else if(s.step<=4){var q=Q[s.step-2],d=s.pick!==null;h=bar()+'<p class="eyebrow">'+q.tag+'</p><h2>'+q.t+'</h2><p>'+q.p+'</p>'+(q.m||"")+'<div class="opts">';
for(i=0;i<4;i++){var c="",ic=L[i];if(d&&i===q.a){c=" ok";ic="✓"}else if(d&&i===s.pick){c=" bad";ic="✗"}
h+='<button class="opt'+c+'" data-a="pick" data-i="'+i+'"'+(d?" disabled":"")+'><span class="badge">'+ic+'</span><span>'+q.o[i]+'</span></button>'}
h+='</div>';
if(d){var r=s.pick===q.a;h+='<div class="fb'+(r?"":" bad")+'"><h3>'+(r?"✓ ¡Correcto! Respuesta: ":"✗ No es esa. La correcta es la ")+L[q.a]+'</h3><p>'+q.w+'</p></div><button class="btn" data-a="next">'+(s.step===4?"Ir al plan de acción":"Siguiente")+'</button>'}
else h+='<p style="color:var(--muted)">Elige una opción para ver la respuesta.</p>';}
else if(s.step===5){var all=s.done.every(Boolean);h=bar()+'<p class="eyebrow">Pregunta 4 · Plan de acción tutorial</p><h2>Plan de Resolución Integral</h2><p>Marca cada paso a medida que lo ejecutas, en este orden:</p><div class="steps">';
for(i=0;i<3;i++){var ok=s.done[i],lk=i>0&&!s.done[i-1]&&!ok;h+='<button class="step'+(ok?" on":"")+'" data-a="step" data-i="'+i+'"'+(lk?" disabled style=\"opacity:.55;cursor:default\"":"")+' aria-pressed="'+ok+'"><span class="n">'+(ok?"✓":i+1)+'</span><span><strong>'+P[i][0]+'</strong><span class="d">'+P[i][1]+'</span></span></button>'}
h+='</div>'+(all?'<div class="fb"><h3>✓ Plan completo</h3><p>Contenido visible, tareas calificadas y estudiantes informados.</p></div><button class="btn" data-a="next">Ver resultado</button>':'<p style="color:var(--muted)">Completa los 3 pasos para finalizar.</p>');}
else{h='<section class="hero"><p class="eyebrow">Resultado</p><h1>¡Caso resuelto!</h1><p class="score" style="color:#fff">'+s.score+' / 3</p><p>respuestas correctas en las preguntas de diagnóstico y solución técnica, más el plan de resolución integral completado.</p><button class="btn" data-a="again">Reiniciar actividad</button></section>';}
app.innerHTML=h;window.scrollTo(0,0)}
app.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var a=b.dataset.a,i=+b.dataset.i;
if(a==="next"){s.step++;s.pick=null}
else if(a==="pick"){s.pick=i;if(i===Q[s.step-2].a)s.score++}
else if(a==="step"){s.done[i]=!s.done[i];for(var k=i+1;k<3;k++)s.done[k]=false}
else if(a==="again"){s={step:0,score:0,pick:null,done:[false,false,false]}}
render()});
render();
</script>
</body>
</html>
